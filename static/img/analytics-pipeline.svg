<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Workspace Analytics data pipeline">
  <!-- figure panel (readable on light and dark pages) -->
  <rect x="0" y="0" width="940" height="380" rx="16" fill="#f7f7fb"/>
  <rect x="0.5" y="0.5" width="939" height="379" rx="16" fill="none" stroke="#e5e7eb"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#111827">Workspace Analytics — data pipeline</text>
  <text x="32" y="66" font-size="13" fill="#6b7280">Analytics without instrumentation: derived from the gateway's request stream. Cookieless, no PII.</text>

  <!-- stage boxes -->
  <!-- 1 Goma -->
  <rect x="32" y="104" width="150" height="86" rx="12" fill="#111827"/>
  <text x="107" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Goma Gateway</text>
  <text x="107" y="160" text-anchor="middle" font-size="11" fill="#cbd5e1">per-request event</text>
  <text x="107" y="175" text-anchor="middle" font-size="11" fill="#cbd5e1">+ GeoIP country</text>

  <!-- 2 Redis stream -->
  <rect x="228" y="104" width="150" height="86" rx="12" fill="#fee2e2" stroke="#ef4444"/>
  <text x="303" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Redis stream</text>
  <text x="303" y="160" text-anchor="middle" font-size="11" fill="#b91c1c" font-family="monospace">goma:analytics</text>
  <text x="303" y="176" text-anchor="middle" font-size="10.5" fill="#b91c1c">XADD (batched)</text>

  <!-- 3 Consumer -->
  <rect x="424" y="104" width="150" height="86" rx="12" fill="#ede9fe" stroke="#a855f7"/>
  <text x="499" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">Consumer</text>
  <text x="499" y="157" text-anchor="middle" font-size="11" fill="#7c3aed">worker · group</text>
  <text x="499" y="172" text-anchor="middle" font-size="11" fill="#7c3aed">aggregate → flush</text>

  <!-- 4 Rollups -->
  <rect x="620" y="104" width="150" height="86" rx="12" fill="#dbeafe" stroke="#2563eb"/>
  <text x="695" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Rollups</text>
  <text x="695" y="157" text-anchor="middle" font-size="11" fill="#1d4ed8">Postgres · minute</text>
  <text x="695" y="172" text-anchor="middle" font-size="11" fill="#1d4ed8">HLL · histograms</text>

  <!-- 5 API/Dashboards -->
  <rect x="816" y="104" width="92" height="86" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="862" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">API</text>
  <text x="862" y="160" text-anchor="middle" font-size="10.5" fill="#15803d">/analytics</text>
  <text x="862" y="175" text-anchor="middle" font-size="10.5" fill="#15803d">+ SSE</text>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#arr)">
    <line x1="184" y1="147" x2="224" y2="147"/>
    <line x1="380" y1="147" x2="420" y2="147"/>
    <line x1="576" y1="147" x2="616" y2="147"/>
    <line x1="772" y1="147" x2="812" y2="147"/>
  </g>

  <!-- dashboards row -->
  <text x="32" y="242" font-size="12" font-weight="600" fill="#374151">Dashboards (per workspace, per app)</text>
  <g font-size="12" font-weight="600">
    <rect x="32"  y="256" width="206" height="72" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="135" y="286" text-anchor="middle" fill="#111827">HTTP Traffic</text>
    <text x="135" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b7280">world map · status · methods</text>

    <rect x="254" y="256" width="206" height="72" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="357" y="286" text-anchor="middle" fill="#111827">Performance</text>
    <text x="357" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b7280">p50/p95/p99 · slow routes</text>

    <rect x="476" y="256" width="206" height="72" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="579" y="286" text-anchor="middle" fill="#111827">Web Analytics</text>
    <text x="579" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b7280">visitors · pages · browsers</text>

    <rect x="698" y="256" width="210" height="72" rx="10" fill="#fff" stroke="#e5e7eb"/>
    <text x="803" y="286" text-anchor="middle" fill="#111827">Overview</text>
    <text x="803" y="306" text-anchor="middle" font-size="10.5" font-weight="400" fill="#6b7280">requests · 4xx/5xx · latency</text>
  </g>

  <!-- connector from API down to dashboards -->
  <path d="M862,190 L862,224 L803,224 L803,252" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="32" y="360" font-size="11" fill="#9ca3af">Privacy: IP resolved to a country at the edge then dropped · daily-salted visitor hash · HyperLogLog uniques · retention capped in Community.</text>
</svg>
