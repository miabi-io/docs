<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Alerts: from signals to notifications">
  <rect x="0" y="0" width="940" height="320" rx="16" fill="#f7f7fb"/>
  <rect x="0.5" y="0.5" width="939" height="319" rx="16" fill="none" stroke="#e5e7eb"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#111827">Raw events are not alerts</text>
  <text x="32" y="66" font-size="13" fill="#6b7280">Signals are the raw material · Alerts are the judgement (deduplicated, stateful) · Notifications are the delivery.</text>

  <!-- Signals -->
  <rect x="32" y="98" width="196" height="150" rx="12" fill="#fff" stroke="#e5e7eb"/>
  <text x="130" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Signals</text>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#6b7280">high-volume, factual</text>
  <g font-size="11" fill="#374151">
    <text x="50" y="176">• container die / oom / health</text>
    <text x="50" y="196">• deploy &amp; backup outcomes</text>
    <text x="50" y="216">• cert · disk · quota scans</text>
    <text x="50" y="236">• node / runner offline</text>
  </g>

  <!-- Alert engine (FSM) -->
  <rect x="284" y="98" width="330" height="150" rx="12" fill="#ede9fe" stroke="#a855f7"/>
  <text x="449" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">Alert engine</text>
  <text x="449" y="143" text-anchor="middle" font-size="11" fill="#7c3aed">dedup · for-duration · auto-resolve</text>

  <!-- FSM -->
  <rect x="306" y="164" width="92" height="34" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="352" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">firing</text>

  <rect x="424" y="164" width="76" height="34" rx="8" fill="#fef9c3" stroke="#d97706"/>
  <text x="462" y="185" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">ack’d</text>

  <rect x="524" y="164" width="76" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="562" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">resolved</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker>
  </defs>
  <g stroke="#9ca3af" stroke-width="1.8" marker-end="url(#a2)" fill="none">
    <line x1="398" y1="181" x2="422" y2="181"/>
    <line x1="500" y1="181" x2="522" y2="181"/>
  </g>
  <path d="M352,164 C352,150 562,150 562,162" stroke="#16a34a" stroke-width="1.6" fill="none" marker-end="url(#a2)"/>
  <text x="457" y="146" text-anchor="middle" font-size="9.5" fill="#16a34a">condition clears → auto-resolve</text>
  <text x="352" y="224" text-anchor="middle" font-size="10" fill="#7c3aed">40 crash events → 1 alert (count climbs)</text>

  <!-- Notifications -->
  <rect x="670" y="98" width="238" height="150" rx="12" fill="#fff" stroke="#e5e7eb"/>
  <text x="789" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Notifications</text>
  <text x="789" y="148" text-anchor="middle" font-size="11" fill="#6b7280">per-user inbox · read/unread</text>
  <g font-size="11" fill="#374151">
    <text x="690" y="176">• dashboard bell (live, SSE)</text>
    <text x="690" y="196">• Notifications page + filters</text>
    <text x="690" y="216">• scoped by workspace + role;</text>
    <text x="700" y="234">platform alerts → super-admins</text>
  </g>

  <g stroke="#9ca3af" stroke-width="2" marker-end="url(#a2)">
    <line x1="230" y1="173" x2="280" y2="173"/>
    <line x1="616" y1="173" x2="666" y2="173"/>
  </g>

  <text x="32" y="298" font-size="11" fill="#9ca3af">No storms: a repeat signal folds into the active alert (no re-notify); a recovery updates it to “recovered” instead of spamming a new one.</text>
</svg>
